[project]
name = "amine-downloader"
version = "0.1.0"
description = "Download anime from BT / Kazumi style sources and rename them to a standard format (qBittorrent / aria2)."
readme = "README.md"
authors = [
    { name = "wenwen12345", email = "76639973+wenwen12345@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cloakbrowser>=0.5.11",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "starlette>=1.7.0",
    "tomli-w>=1.2.0",
    "tomlkit>=0.13.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
amine-downloader = "amine_downloader:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
