# aria2-next 配置示例（Docker）
#
# 用法：复制到 ./aria2/config/aria2.conf（首次启动前），容器会直接用它；
# 若不复制，entrypoint 会自动生成一份最小配置。
#
# 注意：compose 里的 `command:` 会覆盖同名命令行选项（命令行优先级更高）。
# 如果你把密钥/目录都写在这里，可以把 compose 里的 --rpc-secret/--dir 等删掉。

# ---- RPC ----
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
# AriaNg 在 6880、aria2 在 6800，属跨源请求，必须允许 CORS，否则浏览器会拦
rpc-allow-origin-all=true
# 必填：改成你自己的密钥，并与 amine-downloader 的 [aria2].secret 一致
rpc-secret=CHANGE_ME_RPC_SECRET

# ---- 下载目录 ----
# 默认目录；amine-downloader 通常按任务传 dir（媒体库季目录），这里只是兜底
dir=/wenwen/media/acg

# ---- 会话 / 续传（挂载在 /var/lib/aria2-next）----
continue=true
input-file=/var/lib/aria2-next/session.txt
save-session=/var/lib/aria2-next/session.txt
save-session-interval=60
auto-save-interval=60
force-save=true

# ---- HTTP / 连接 ----
max-concurrent-downloads=5
max-connection-per-server=8
split=8
min-split-size=10M
max-tries=5
retry-wait=5
connect-timeout=30
timeout=60
auto-file-renaming=false
# 允许覆盖同名文件：远程资源变化（Last-Modified/ETag 变了）导致续传校验失败时，
# 删掉残留后可以直接覆盖重下
allow-overwrite=true
summary-interval=0
console-log-level=warn

# ---- 续传 / 远程资源变化 ----
# aria2-next 会校验远程资源身份；不一致时报
#   "The remote resource Last-Modified changed; existing data was preserved"
# 并保留已下载数据（不自动覆盖）。对“远程经常变”的源（CDN / 对象存储 / 签名 URL），
# 可以对该任务关掉续传，永远从头下：
# continue=false

# ---- NAS / 网络盘优化 ----
# 网络文件系统上预分配很慢，用 none 让文件按需增长
file-allocation=none
# 关闭磁盘缓存对网络盘更稳（如 aria2-next 报未知选项，删掉这一行即可）
# disk-cache=0

# ---- BitTorrent ----
# 本 compose 用 aria2 兼顾 BT，保留这段；只做 HTTP/HLS 时可整段忽略
listen-port=6881
dht-listen-port=6881
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=true
bt-max-peers=128
seed-time=0
follow-torrent=true

# ---- 其它 ----
# 需要 HTTP 代理时打开
# all-proxy=http://user:pass@host:port
